controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.25
    min_y_velocity_threshold: 0.25
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.7
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 3.0
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.75
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.75
      regulated_linear_scaling_min_speed: 0.75
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      max_accel: 0.50       # meters/sec² (linear ramp up/down)
      max_decel: 1.0       # optional, can be slightly higher if braking
      use_backwards_motion: false
    
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

behavior_server:
  ros__parameters:
    use_sim_time: false
    recovery_plugins: ["wait", "backup"]
    wait:
      plugin: "nav2_behaviors/Wait"
    backup:
      plugin: "nav2_behaviors/BackUp"

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["wait", "backup"]
    wait:
      plugin: "nav2_behaviors/Wait"
    backup:
      plugin: "nav2_behaviors/BackUp"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: true

# Fake maps to use for testing
local_costmap:
  ros__parameters:
    footprint: "[[-0.2, -0.1], [-0.2, 0.1], [0.2, 0.1], [0.2, -0.1]]"
    use_sim_time: false
    global_frame: odometry/filtered
    robot_base_frame: base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    resolution: 0.05
    width: 100
    height: 100
    origin_x: -50
    origin_y: -50
    plugins: ["voxel_layer", "inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25
      cost_scaling_factor: 7.0
    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      publish_voxel_map: true
      origin_z: 0.0
      z_resolution: 0.05
      z_voxels: 16
      max_obstacle_height: 2.0
      unknown_threshold: 15
      mark_threshold: 0
      observation_sources: pointcloud
      combination_method: 1
      pointcloud:  # no frame set, uses frame from message
        topic: /camera/camera/cloud_from_depth
        max_obstacle_height: 2.0
        min_obstacle_height: 0.01
        obstacle_max_range: 5.0
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        clearing: true
        marking: true
        data_type: "PointCloud2"


global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    resolution: 0.05
    width: 1000
    height: 1000
    origin_x: -500
    origin_y: -500
    plugins: ["voxel_layer", "inflation_layer"]
    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      publish_voxel_map: true
      origin_z: 0.0
      z_resolution: 0.05
      z_voxels: 16
      unknown_threshold: 15
      mark_threshold: 0
      observation_sources: pointcloud
      combination_method: 1
      pointcloud:  # no frame set, uses frame from message
        topic: /camera/camera/cloud_from_depth
        max_obstacle_height: 2.0
        min_obstacle_height: 0.01
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        clearing: true
        marking: true
        data_type: "PointCloud2"
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25
      cost_scaling_factor: 7.0

map_server:
  ros__parameters:
    yaml_filename: /path/to/blank_map.yaml
    use_sim_time: false

