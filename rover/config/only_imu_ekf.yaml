ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom  

    publish_tf: true
    publish_acceleration: false
    use_control: false

    odom0: /odom
    odom0_config: [true, true, true,   # Position (x, y, z)
                   true, true, true,   # Orientation
                   true, true, true,   # Linear velocity
                   true, true, true,   # Angular velocity
                   false, false, false]  # Linear Acceleration (exclude these!)

    odom0_differential: false
    odom0_relative: false   # <- IMPORTANT: use absolute data
