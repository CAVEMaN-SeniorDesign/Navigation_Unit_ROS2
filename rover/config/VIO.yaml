ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    publish_acceleration: false
    use_control: false

    imu0: /imu_raw
    imu0_config: [false, false, false, # Position (x, y, z)
                  true,  true,  true, # Orientation (roll, pitch, yaw), should consider disabling pitch as it seems to drift the most
                  false, false, false, # Linear velocity
                  false,  false,  false, # Angular velocity
                  false,  false,  false] # Linear Acceleration
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 5
    imu0_pose_rejection_threshold: 0.8                 # Note the difference in parameter names
    imu0_twist_rejection_threshold: 0.8                #
    imu0_linear_acceleration_rejection_threshold: 0.8  #

    # [ADVANCED] Some IMUs automatically remove acceleration due to gravity, and others don't. If yours doesn't, please set
    # this to true, and *make sure* your data conforms to REP-103, specifically, that the data is in ENU frame.
    imu0_remove_gravitational_acceleration: false

    odom0: /odom
    odom0_config: [true, true, true,   # Position (x, y, z)
                   true, false, true,   # Orientation (roll, pitch, yaw), should consider disabling pitch as it seems to drift the most
                   true, true, true,   # Linear velocity
                   true, true, true,   # Angular velocity
                   false, false, false]  # Linear Acceleration

    odom0_differential: false
    odom0_relative: false
